<style>

<div id="mod"><div class="in" id="modin"></div></div><div id="run"></div><div id="toast"></div><input type="file" id="imp" accept=".json" style="display:none"><input type="file" id="phf" accept="image/*" style="display:none">
<script>

exercises:[],complexes:[],trainings:[],completions:{},weightLog:[],profile:{name:'',age:'',weight:70,avatar:null},themeId:'neon',themeMode:'dark',totalXp:0,xpLog:[],xpGears:{},xpZones:{},xpSkills:{},timerConfig:{prep:5,work:20,rest:10,sets:8,rounds:1,roundRest:30}};

function applyTheme(){const t=THEMES.find(x=>x.id===D.themeId)||THEMES[0],m=t[D.themeMode==='light'?'day':'night'],r=document.documentElement.style;for(const k in m)r.setProperty('--'+k,m[k]);r.setProperty('--grad','linear-gradient(135deg,'+m.acc+','+m.acc2+')');document.body.classList.toggle('notebook-on',t.isNotebook);document.body.classList.toggle('day',D.themeMode==='light')}

function openM(h){H('modin',h);sh('mod','flex')}function closeM(){sh('mod','none');H('modin','')}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},200)}catch(e){}try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}}
function readImg(f,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=300;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,300,300);cb(c.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(f)}
const n=v=>v==='X'||v==='x'?0:(+v||0),pv=v=>{v=String(v).trim();return v===''?0:(v.toUpperCase()==='X'?'X':(+v||0))},fx=v=>v==='X'?'<span class="X">X</span>':v;
const nm=(k,id)=>{const o=D[k].find(x=>x.id===id);return o?o.emoji+' '+o.name:''};
// xp
const lvXp=l=>l*(l-1)/2,cl=xp=>{const l=Math.max(1,Math.floor((1+Math.sqrt(1+8*Math.max(0,xp)))/2));return{level:l,current:xp-lvXp(l),need:l}};
const RANKS=[[1,'Новичок'],[5,'Любитель'],[10,'Атлет'],[20,'Спортсмен'],[35,'Мастер'],[50,'Ветеран'],[75,'Чемпион'],[100,'Легенда']];
const rank=l=>RANKS.filter(r=>l>=r[0]).pop()[1],ico=l=>l<5?'🥉':l<10?'🥈':l<20?'🥇':l<35?'💎':'👑';
function itemXp(it){const e=D.exercises.find(x=>x.id===it.exId);if(!e)return 0;const s=n(it.sets)||1;if(e.format==='time')return n(it.time)*.01*s;if(e.format==='weight')return n(it.weight)/(+D.profile.weight||70)*.01*n(it.reps)*s;return n(it.reps)*.1*s}
const exsXp=a=>a.reduce((s,i)=>s+itemXp(i),0);
function spread(exs,xp){const z=new Set,gs=new Set,sk=new Set;exs.forEach(i=>{const e=D.exercises.find(x=>x.id===i.exId);if(e){(e.zones||[]).forEach(x=>z.add(x));(e.gears||[]).forEach(x=>gs.add(x));(e.skills||[]).forEach(x=>sk.add(x))}});
[[z,'xpZones'],[gs,'xpGears'],[sk,'xpSkills']].forEach(([st,k])=>st.forEach(id=>{const o=D[k][id]||(D[k][id]={xp:0,lastTrained:null});o.xp=Math.max(0,o.xp+xp/st.size);if(xp>0)o.lastTrained=new Date().toISOString()}))}
function decay(){const t=TODAY(),last=ld('decayLastCheck',null);if(last===t)return;sv('decayLastCheck',t);if(!last)return;const days=Math.min(30,Math.round((pd(t)-pd(last))/864e5));if(days<1)return;
const rate=d=>d<7?0:d<14?.001:d<30?.0025:d<60?.005:.01,tl=d=>d<7?0:d<14?.5:d<30?1:2;let lost=0;
['xpGears','xpZones','xpSkills'].forEach(k=>{for(const id in D[k]){const o=D[k][id];if(!o.lastTrained)continue;const d=Math.floor((Date.now()-new Date(o.lastTrained))/864e5),b=o.xp;o.xp=Math.max(0,o.xp*(1-rate(d)*days));}});
const ds=Object.keys(D.completions).filter(k=>Object.values(D.completions[k]).some(c=>c&&c.done)).sort();if(ds.length){const d=Math.floor((Date.now()-pd(ds[ds.length-1]))/864e5),l=Math.min(D.totalXp,tl(d)*days);if(l>0){D.totalXp-=l;lost=l}}

// trainings
const sow=d=>{const x=new Date(d);x.setDate(x.getDate()-((x.getDay()+6)%7));x.setHours(0,0,0,0);return x};
const trainsFor=ds=>{const d=pd(ds).getDay();return D.trainings.filter(t=>(t.days||[]).includes(d)&&(!t.startDate||ds>=t.startDate)&&(!t.endDate||ds<=t.endDate))};
const exsFor=(t,ds)=>(t.dayOverrides&&t.dayOverrides[ds]&&t.dayOverrides[ds].exercises)||t.exercises||[];
const timeFor=(t,ds)=>(t.dayOverrides&&t.dayOverrides[ds]&&t.dayOverrides[ds].time)||t.time||'00:00';
const isDone=(ds,id)=>!!(D.completions[ds]&&D.completions[ds][id]&&D.completions[ds][id].done);
function toggleDone(ds,tid){const t=D.trainings.find(x=>x.id===tid);if(!t)return;const exs=exsFor(t,ds);D.completions[ds]=D.completions[ds]||{};

// nav

// calendar

const MN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

const cell=(d,dim)=>{const ds=fd(d);return '<div class="dc '+(ds===sel?'sel ':'')+(ds===TODAY()?'tod ':'')+(dim?'dim':'')+'" onclick="pick(\''+ds+'\')"><b>'+d.getDate()+'</b><div class="dots">'+dots(ds)+'</div></div>'};

function dose(it){const p=[];if(it.sets)p.push(fx(it.sets)+' подх');if(it.reps)p.push(fx(it.reps)+' повт');if(it.time)p.push(fx(it.time)+' с');if(it.weight)p.push(fx(it.weight)+' кг');if(it.rest)p.push('отд '+fx(it.rest)+' с');return p.join(' · ')+(it.note?' · '+esc(it.note):'')}

function editDay(tid,ds,i){const t=D.trainings.find(x=>x.id===tid);if(!t)return;const o=ovr(t,ds);cfg(o.exercises[i],()=>{sa();closeM();rMain()},closeM)}

function rMain(){const now=new Date(),doy=Math.floor((now-new Date(now.getFullYear(),0,0))/864e5),w=Math.min(52,Math.ceil(doy/7)),c=cl(D.totalXp);

function rProf(){const p=D.profile;H('v-prof','<div class="card row"><div class="av" id="av" style="'+(p.avatar?'background-image:url('+p.avatar+')':'')+'" onclick="avPick()">'+(p.avatar?'':'👤')+'</div><div class="g" style="flex:1"><input id="p-n" placeholder="Имя" value="'+esc(p.name)+'"><div class="row"><input id="p-a" type="number" placeholder="Возраст" value="'+esc(p.age)+'"><input id="p-w" type="number" step="0.1" placeholder="Масса, кг" value="'+esc(p.weight)+'"></div><button class="btn" onclick="saveProf()">Сохранить</button></div></div>'+
'<div class="card"><b>⚖️ Журнал веса</b><br><button class="btn s" style="margin-top:5px" onclick="wOpen()">Открыть журнал</button></div>'+
'<div class="card"><b>⏱ Таймер</b><div class="g" style="grid-template-columns:1fr 1fr;margin:6px 0">'+TK.map(a=>'<div><div class="mut">'+a[1]+'</div><div class="row"><button class="ib" onclick="tAdj(\''+a[0]+'\',-1)">−</button><input id="tc-'+a[0]+'" type="number" value="'+D.timerConfig[a[0]]+'"><button class="ib" onclick="tAdj(\''+a[0]+'\',1)">+</button></div></div>').join('')+'</div><div>'+Object.keys(PRE).map(k=>'<span class="chip" onclick="tPre(\''+k+'\')">'+k+'</span>').join('')+'</div><div class="row" style="margin-top:6px"><button class="btn" onclick="tOpen()">Открыть</button><button class="btn s" onclick="D.timerConfig=tRead();sa();toast(\'Сохранено\')">Сохранить</button></div></div>'+
'<div class="card"><b>🎨 Тема</b><div class="g" style="grid-template-columns:repeat(3,1fr);margin-top:6px">'+THEMES.map(t=>'<button class="btn '+(t.id===D.themeId?'':'s')+'" style="'+(t.id===D.themeId?'':'border-left:4px solid '+t.night.acc)+'" onclick="D.themeId=\''+t.id+'\';sv(\'themeId\',D.themeId);applyTheme();rProf()">'+t.name+'</button>').join('')+'</div></div>'+
'<div class="card g" style="grid-template-columns:1fr 1fr"><button class="btn s" onclick="expD()">📤 Экспорт</button><button class="btn s" onclick="g(\'imp\').click()">📥 Импорт</button><button class="btn s" onclick="shareD()">🔗 Поделиться</button><button class="btn s" onclick="copyD()">📋 В буфер</button></div><div class="card g"><button class="btn s" onclick="info()">ℹ️ Справка</button><button class="btn s" onclick="resetAll()">🗑 Сбросить всё</button></div>')}
RN.prof=rProf;
function avPick(){const f=g('phf');if(!f)return;f.onchange=()=>readImg(f.files[0],d=>{D.profile.avatar=d;sa();rProf();f.value=''});f.click()}
function saveProf(){D.profile.name=V('p-n');D.profile.age=V('p-a');D.profile.weight=+V('p-w')||D.profile.weight;sa();toast('Сохранено')}
// timer modal
let TM=null;
function tOpen(){const c=tRead(),seq=[];seq.push(['Подготовка',c.prep]);for(let r=1;r<=c.rounds;r++){for(let s=1;s<=c.sets;s++){seq.push(['Работа · '+s+'/'+c.sets+' · раунд '+r,c.work]);if(s<c.sets)seq.push(['Отдых',c.rest])}if(r<c.rounds)seq.push(['Отдых раунда',c.roundRest])}
TM={seq:seq.filter(x=>x[1]>0),i:0,t:0,p:0};if(!TM.seq.length)return;TM.t=TM.seq[0][1];tDraw();clearInterval(TM.iv);TM.iv=setInterval(()=>{if(!TM||TM.p)return;TM.t--;if(TM.t<=0){beep();TM.i++;if(TM.i>=TM.seq.length){clearInterval(TM.iv);tDraw(1);return}TM.t=TM.seq[TM.i][1]}tDraw()},1000)}
function tDraw(done){if(!TM)return;const s=TM.seq[TM.i]||['Готово',0],m=Math.floor(TM.t/60);openM('<div style="text-align:center"><h3>'+(done?'🎉 Готово':esc(s[0]))+'</h3><div class="big">'+pad(m)+':'+pad(TM.t%60)+'</div><div class="bar" style="margin:8px 0"><i style="width:'+(s[1]?(1-TM.t/s[1])*100:100)+'%"></i></div><div class="mut">Этап '+Math.min(TM.i+1,TM.seq.length)+' из '+TM.seq.length+'</div><div class="row" style="margin-top:8px"><button class="btn" onclick="TM.p=!TM.p">Пауза</button><button class="btn s" onclick="clearInterval(TM.iv);TM=null;closeM()">Закрыть</button></div></div>')}
// runner
let R=null;
function runT(ds,tid){const t=D.trainings.find(x=>x.id===tid);if(!t)return;const items=JSON.parse(JSON.stringify(exsFor(t,ds)));if(!items.length){toast('Нет упражнений');return}R={ds,tid,items,i:0,set:1,ph:'ready',t:0,tot:0,up:0,p:0,name:t.name,xd:0};sh('run','flex');clearInterval(R.iv);R.iv=setInterval(rtick,1000);rr()}
function rclose(){if(R){clearInterval(R.iv);R=null}sh('run','none');H('run','')}
const cur_ex=()=>{const it=R.items[R.i];return[it,D.exercises.find(x=>x.id===it.exId)||{name:'?',format:'reps'}]};
function rstartW(){const[it,e]=cur_ex(),d=e.format==='time'?n(it.time):0;R.ph='work';R.up=!d;R.t=d;R.tot=d;rr()}
function rendW(){const[it]=cur_ex();beep();if(R.set>=(n(it.sets)||1))return rnext();const r=n(it.rest);if(r>0){R.ph='rest';R.t=r;R.tot=r;rr()}else{R.set++;rstartW()}}
function rnext(){R.i++;R.set=1;R.xd=0;if(R.i>=R.items.length){R.ph='done'}else R.ph='ready';rr()}
function rtick(){if(!R||R.p||R.ph==='ready'||R.ph==='done')return;if(R.ph==='work'){if(R.up){R.t++}else{R.t--;if(R.t<=0)return rendW()}}else{R.t--;if(R.t<=0){beep();R.set++;return rstartW()}}rr()}
function rxok(){const[it]=cur_ex();['sets','reps','time','rest','weight'].forEach(k=>{if(it[k]==='X'){const v=+V('rx-'+k);it[k]=v||0}});R.xd=1;rstartW()}
function rr(){if(!R)return;const tot=R.items.length;
if(R.ph==='done'){const t=D.trainings.find(x=>x.id===R.tid),x=exsXp(t?exsFor(t,R.ds):[]);H('run','<div style="margin:auto"><div style="font-size:60px">🎉</div><h3>Тренировка завершена</h3><div class="big" style="font-size:34px">+'+x.toFixed(1)+' XP</div><div class="g" style="margin-top:14px"><button class="btn" onclick="rfin()">✓ Засчитать тренировку</button><button class="btn s" onclick="rclose()">Закрыть</button></div></div>');return}
const[it,e]=cur_ex(),xs=['sets','reps','time','rest','weight'].filter(k=>it[k]==='X'),lab={sets:'Подходы',reps:'Повторы',time:'Время, с',rest:'Отдых, с',weight:'Вес, кг'};
let h='<div class="row" style="justify-content:space-between"><button class="ib" onclick="rclose()">✕</button><b>'+esc(R.name)+'</b><span>'+(R.i+1)+'/'+tot+'</span></div><div style="margin:auto;width:100%;max-width:420px"><div class="mut">Упражнение '+(R.i+1)+'</div><h3 style="font-size:18px;text-transform:none">'+esc(e.name)+'</h3><div class="mut">'+[...(e.zones||[]).map(i=>nm('zones',i)),...(e.gears||[]).map(i=>nm('gears',i)),...(e.skills||[]).map(i=>nm('skills',i))].join(' · ')+'</div>';
if(R.ph==='ready'&&xs.length&&!R.xd){h+='<h3 style="margin-top:14px">Задай параметры</h3><div class="g">'+xs.map(k=>'<div><div class="mut">'+lab[k]+'</div><input id="rx-'+k+'" type="number" step="any"></div>').join('')+'</div><button class="btn" style="margin-top:10px;width:100%" onclick="rxok()">▶ Начать упражнение</button></div>';H('run',h);return}
const m=Math.floor(Math.abs(R.t)/60);
h+='<div style="margin:14px 0 4px;color:var(--acc);font-weight:700">'+(R.ph==='ready'?'Готов':R.ph==='work'?'Работа · подход '+R.set+'/'+(n(it.sets)||1):'Отдых · перед '+(R.set+1))+'</div><div class="big">'+pad(m)+':'+pad(Math.abs(R.t)%60)+'</div><div class="bar" style="margin:8px 0"><i style="width:'+(R.tot?Math.min(100,(1-R.t/R.tot)*100):0)+'%"></i></div><div class="mut">'+dose(it)+'</div><div class="g" style="margin-top:14px">';
if(R.ph==='ready')h+='<button class="btn" onclick="R.xd=1;rstartW()">▶ Начать упражнение</button>';
else if(R.ph==='work')h+='<button class="btn" onclick="rendW()">Подход готов</button><button class="btn s" onclick="R.p=!R.p;rr()">'+(R.p?'Продолжить':'Пауза')+'</button><button class="btn s" onclick="rnext()">Пропустить</button>';
else h+='<button class="btn" onclick="R.set++;rstartW()">▶ Следующий подход</button><button class="btn s" onclick="R.set++;rstartW()">Пропустить отдых</button><button class="btn s" onclick="rnext()">Пропустить</button>';
H('run',h+'</div></div>')}
function rfin(){const{ds,tid}=R;if(!isDone(ds,tid))toggleDone(ds,tid);rclose()}
// export/import
const dump=()=>JSON.stringify(D);
function expD(){const b=new Blob([dump()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='as-fit-'+TODAY()+'.json';document.body.appendChild(a);a.click();a.remove()}
async function shareD(){try{const f=new File([dump()],'as-fit-'+TODAY()+'.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else toast('Не поддерживается — используй экспорт')}catch(e){}}
async function copyD(){try{await navigator.clipboard.writeText(dump());toast('Скопировано')}catch(e){toast('Не удалось скопировать')}}
function impData(o){const add=confirm('OK — добавить к текущим данным / Отмена — заменить');if(!add){for(const k in DEF)if(o[k]!==undefined)D[k]=o[k]}
else{['exercises','complexes','trainings','xpLog'].forEach(k=>{(o[k]||[]).forEach(x=>{if(k==='xpLog'||!D[k].some(y=>y.id===x.id))D[k].push(x)})});['zones','gears','skills'].forEach(k=>(o[k]||[]).forEach(x=>{if(!D[k].some(y=>y.id===x.id))D[k].push(x)}));
['completions','xpGears','xpZones','xpSkills'].forEach(k=>Object.assign(D[k],o[k]||{}));(o.weightLog||[]).forEach(w=>{if(!D.weightLog.some(y=>y.date===w.date))D.weightLog.push(w)});D.totalXp+=+o.totalXp||0}
sa();applyTheme();show(cur);toast('Импорт завершён')}
const imp=g('imp');if(imp)imp.onchange=()=>{const f=imp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{impData(JSON.parse(r.result))}catch(e){toast('Неверный файл')}imp.value=''};r.readAsText(f)};
function resetAll(){if(!confirm('Сбросить ВСЕ данные?'))return;Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k));location.reload()}
// info
function info(){const T=[['Тренировки','Нажми «+ Тренировка», выбери дни недели и период (С/По). Это шаблон: он сам появится в нужные дни. Чтобы изменить один день — раскрой тренировку и жми ✏️ у упражнения: правка сохранится только для этой даты.'],['Выполнение','✓ — отметить сделанной, ▶ — запустить с таймером. Только для сегодня и прошлого; будущее закрыто 🔒. Снятие ✓ отнимает XP.'],['X-параметры','Введи X вместо числа в дозировке — перед упражнением приложение спросит значение. Пример: подходы 3, повторы X.'],['Упражнения','Тегируй зонами, снарядами, навыками. Формат XP: время, вес или повторы. Фото обрезается в квадрат.'],['Комплексы','Готовый набор упражнений. Создаётся на вкладке «Комплексы», добавляется в тренировку кнопкой «+ Комплекс».'],['Зоны/Снаряды/Навыки','Фильтры на вкладке «Упражнения» — свёрнуты по умолчанию. Свой снаряд — «+ Свой снаряд».'],['Журнал веса','Профиль → «Открыть журнал». Запись на ту же дату заменяется. Последний вес идёт в формулы XP.'],['XP и уровни','XP копится в атлете, снарядах, зонах и навыках. Уровень N→N+1 требует N XP. 8 рангов: от Новичка до Легенды (100+).'],['Распад','Через 7 дней без тренировки XP начинает таять: чем дольше пауза, тем быстрее (до −1% в день у зон, −2 XP/день у атлета).'],['Таймер','6 параметров и пресеты (Табата, HIIT, EMOM и др.). «Открыть» запускает, «Сохранить» запоминает.'],['Темы','10 тем, у каждой день и ночь — тумблер в шапке. «Блокнот» — в клетку, с полями.'],['Экспорт/Импорт','Данные лежат в localStorage браузера (ключи as2_*). Делай экспорт в файл JSON — это резервная копия. При импорте можно добавить или заменить.']];
openM('<h3>Как пользоваться</h3>'+T.map(t=>'<h4>'+t[0]+'</h4><div>'+t[1]+'</div>').join('')+'<button class="btn s" onclick="closeM()" style="margin-top:8px">Закрыть</button>')}
// init
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeM();if(R)rclose()}});
const md=g('mod');if(md)md.addEventListener('click',e=>{if(e.target===md)closeM()});
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
applyTheme();decay();show('main');
</script></body></html>
