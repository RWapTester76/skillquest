<!DOCTYPE html>
<html lang="ru" data-theme="dark" data-accent="ember">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>FizUp — календарь тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#07080a;
  font-family:'Manrope',sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
button,input,select,textarea{font-family:inherit;}
:root{
  --radius-lg:22px;
  --radius-md:14px;
  --radius-sm:9px;
  --radius-pill:999px;
}
html[data-theme="dark"]{
  --bg:#14161A; --surface:#1C1F24; --surface-2:#23262C; --raised:#2A2E35;
  --border:#33373E; --text:#EDEEF0; --text-dim:#9AA0AA; --text-faint:#666B73;
  --shadow:0 24px 50px rgba(0,0,0,.5);
  --overlay-bg:rgba(6,7,9,.72);
}
html[data-theme="light"]{
  --bg:#EEF0F2; --surface:#FFFFFF; --surface-2:#F6F7F9; --raised:#FFFFFF;
  --border:#DFE2E6; --text:#181A1D; --text-dim:#585E67; --text-faint:#93989F;
  --shadow:0 24px 50px rgba(20,22,26,.14);
  --overlay-bg:rgba(20,22,26,.45);
}
html[data-accent="ember"]{--accent-rgb:255,90,54;}
html[data-accent="moss"]{--accent-rgb:122,178,66;}
html[data-accent="cyan"]{--accent-rgb:32,182,178;}
html[data-accent="violet"]{--accent-rgb:140,108,216;}

#app{
  max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;
  position:relative;overflow-x:hidden;
}
@media(min-width:461px){
  body{display:flex;justify-content:center;padding:30px 12px;}
  #app{height:860px;min-height:860px;border-radius:34px;box-shadow:var(--shadow);border:1px solid var(--border);overflow:hidden;}
}
.scroll-area{flex:1;overflow-y:auto;padding-bottom:14px;}
.scroll-area::-webkit-scrollbar{width:0;}

/* ---------- Topbar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px;flex-shrink:0;gap:10px;}
.profile-chip{display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;cursor:pointer;color:var(--text);text-align:left;}
.avatar{width:40px;height:40px;border-radius:50%;background:rgba(var(--accent-rgb),.16);color:rgb(var(--accent-rgb));display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:17px;flex-shrink:0;}
.profile-chip .pname{font-size:12.5px;color:var(--text-dim);line-height:1.25;}
.profile-chip .pname b{display:block;font-size:14.5px;color:var(--text);font-weight:700;}
.top-actions{display:flex;gap:8px;flex-shrink:0;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--text-dim);cursor:pointer;flex-shrink:0;}
.icon-btn svg{width:18px;height:18px;}
.icon-btn:active{transform:scale(.92);}
.wordmark{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:21px;letter-spacing:.2px;padding:0 18px;margin:2px 0 6px;}
.wordmark span{color:rgb(var(--accent-rgb));}

/* ---------- Segmented control ---------- */
.segmented{display:flex;margin:2px 18px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-pill);padding:3px;}
.segmented button{flex:1;border:none;background:none;padding:8px 0;border-radius:var(--radius-pill);font-weight:700;font-size:12.5px;color:var(--text-dim);cursor:pointer;}
.segmented button.active{background:rgb(var(--accent-rgb));color:#fff;}

/* ---------- Calendar nav ---------- */
.calnav{display:flex;align-items:center;justify-content:space-between;padding:0 18px 10px;}
.calnav .label{font-family:'Big Shoulders Display',sans-serif;font-weight:600;font-size:19px;text-transform:capitalize;}
.calnav .navbtns{display:flex;gap:6px;}
.navbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text-dim);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.navbtn svg{width:15px;height:15px;}
.todaybtn{border:1px solid var(--border);background:var(--surface);color:var(--text-dim);font-size:11.5px;font-weight:700;padding:0 12px;border-radius:var(--radius-pill);cursor:pointer;height:32px;}

/* ---------- Month grid ---------- */
.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);padding:0 14px;margin-bottom:4px;}
.weekday-row span{text-align:center;font-size:10.5px;color:var(--text-faint);font-weight:700;}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:0 12px;}
.day-cell{aspect-ratio:1/1;border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;background:transparent;border:1px solid transparent;}
.day-cell .num{font-family:'Big Shoulders Display',sans-serif;font-weight:600;font-size:15.5px;color:var(--text);}
.day-cell.other-month .num{opacity:.28;}
.day-cell.today{border-color:rgba(var(--accent-rgb),.7);background:rgba(var(--accent-rgb),.08);}
.day-cell.today .num{color:rgb(var(--accent-rgb));}
.day-cell:active{background:var(--surface-2);}
.day-cell .dots{display:flex;gap:2px;height:5px;}
.dot{width:4.5px;height:4.5px;border-radius:50%;background:var(--text-faint);}
.dot.past{background:var(--text-faint);}
.dot.today{background:rgb(var(--accent-rgb));}
.dot.future{border:1.3px solid rgb(var(--accent-rgb));background:transparent;width:3.6px;height:3.6px;}

/* ---------- Week list / Day list ---------- */
.week-list{padding:2px 14px;display:flex;flex-direction:column;gap:8px;}
.week-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--surface);cursor:pointer;}
.week-row.is-today{border-color:rgba(var(--accent-rgb),.55);}
.week-row .wd{width:44px;flex-shrink:0;text-align:center;}
.week-row .wd .n{font-family:'Big Shoulders Display',sans-serif;font-size:22px;font-weight:700;line-height:1;}
.week-row .wd .l{font-size:10px;color:var(--text-faint);font-weight:700;text-transform:uppercase;}
.week-row.is-today .wd .n{color:rgb(var(--accent-rgb));}
.week-row .chips{display:flex;flex-wrap:wrap;gap:5px;flex:1;}
.week-row .none{font-size:12.5px;color:var(--text-faint);}
.mini-chip{font-size:11px;font-weight:700;padding:4px 9px;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--text-dim);white-space:nowrap;}
.mini-chip.today{background:rgba(var(--accent-rgb),.15);color:rgb(var(--accent-rgb));}

.day-head{padding:4px 18px 14px;}
.day-head .big{font-family:'Big Shoulders Display',sans-serif;font-size:46px;font-weight:700;line-height:.9;}
.day-head .sub{color:var(--text-dim);font-size:13.5px;margin-top:4px;font-weight:600;}
.day-cards{padding:0 14px;display:flex;flex-direction:column;gap:10px;}

.wk-card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:13px 14px;cursor:pointer;}
.wk-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.wk-card .time{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:19px;color:rgb(var(--accent-rgb));}
.wk-card .name{font-weight:800;font-size:15px;margin-top:1px;}
.wk-card .meta{font-size:12px;color:var(--text-faint);margin-top:2px;}
.status-badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:var(--radius-pill);flex-shrink:0;}
.status-badge.past{background:var(--surface-2);color:var(--text-faint);}
.status-badge.today{background:rgba(var(--accent-rgb),.16);color:rgb(var(--accent-rgb));}
.status-badge.future{border:1px solid var(--border);color:var(--text-dim);}
.wk-card .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;}

/* ---------- Year grid ---------- */
.year-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 14px;}
.mini-month{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:11px;cursor:pointer;}
.mini-month .mm-title{font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:15px;margin-bottom:7px;text-transform:capitalize;}
.mm-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
.mm-cell{aspect-ratio:1/1;border-radius:2px;background:var(--surface-2);}
.mm-cell.has1{background:rgba(var(--accent-rgb),.35);}
.mm-cell.has2{background:rgba(var(--accent-rgb),.7);}
.mm-cell.has3{background:rgb(var(--accent-rgb));}
.mm-cell.blank{background:transparent;}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:36px 30px;color:var(--text-faint);}
.empty .ic{width:44px;height:44px;margin:0 auto 12px;color:var(--text-faint);}
.empty .t{font-weight:800;color:var(--text-dim);font-size:15px;margin-bottom:4px;}
.empty .s{font-size:13px;line-height:1.5;}

/* ---------- FAB ---------- */
.fab{position:absolute;right:20px;bottom:88px;width:56px;height:56px;border-radius:50%;background:rgb(var(--accent-rgb));color:#fff;border:none;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(var(--accent-rgb),.45);cursor:pointer;z-index:20;}
.fab svg{width:24px;height:24px;}
.fab:active{transform:scale(.93);}

/* ---------- Bottom nav ---------- */
.bottomnav{display:flex;border-top:1px solid var(--border);background:var(--surface);flex-shrink:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));}
.navitem{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--text-faint);cursor:pointer;}
.navitem svg{width:21px;height:21px;}
.navitem span{font-size:10.5px;font-weight:700;}
.navitem.active{color:rgb(var(--accent-rgb));}

/* ---------- Screens ---------- */
.screen-head{padding:18px 18px 4px;}
.screen-head h1{font-family:'Big Shoulders Display',sans-serif;font-size:26px;font-weight:700;margin:0;}
.screen-head p{color:var(--text-dim);font-size:13px;margin:3px 0 0;}

/* ---------- Cards / lists generic ---------- */
.section{padding:16px 18px 2px;}
.section-title{font-size:12.5px;font-weight:800;color:var(--text-faint);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;}
.card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:14px;}
.stat-row{display:flex;gap:10px;}
.stat-box{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:12px;text-align:center;}
.stat-box .v{font-family:'Big Shoulders Display',sans-serif;font-size:24px;font-weight:700;}
.stat-box .l{font-size:10.5px;color:var(--text-faint);font-weight:700;margin-top:2px;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:800;color:var(--text-dim);margin-bottom:6px;}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 12px;color:var(--text);font-size:14.5px;font-weight:600;
}
.field textarea{resize:vertical;min-height:70px;font-weight:500;line-height:1.5;}
.field-row{display:flex;gap:10px;}
.field-row .field{flex:1;}
.chiprow{display:flex;flex-wrap:wrap;gap:7px;}
.chip{border:1px solid var(--border);background:var(--surface-2);color:var(--text-dim);font-size:12.5px;font-weight:700;padding:7px 13px;border-radius:var(--radius-pill);cursor:pointer;}
.chip.active{background:rgb(var(--accent-rgb));border-color:transparent;color:#fff;}
.tag{font-size:10.5px;font-weight:800;color:var(--text-dim);background:var(--surface-2);padding:3px 9px;border-radius:var(--radius-pill);}
.durchips{display:flex;gap:7px;}

.list-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.list-item .thumb{width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-faint);flex-shrink:0;overflow:hidden;}
.list-item .thumb img{width:100%;height:100%;object-fit:cover;}
.list-item .thumb svg{width:17px;height:17px;}
.list-item .body{flex:1;min-width:0;}
.list-item .body .n{font-weight:800;font-size:14px;}
.list-item .body .m{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
.list-item .del{width:30px;height:30px;border-radius:50%;border:none;background:none;color:var(--text-faint);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.list-item .del svg{width:16px;height:16px;}
.list-item .grip{color:var(--text-faint);}

.exercise-card{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;margin-bottom:9px;}
.exercise-card .thumb{width:48px;height:48px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-faint);flex-shrink:0;overflow:hidden;}
.exercise-card .thumb img{width:100%;height:100%;object-fit:cover;}
.exercise-card .thumb svg{width:20px;height:20px;}
.exercise-card .n{font-weight:800;font-size:14.5px;}
.exercise-card .tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.exercise-card .chevron{color:var(--text-faint);flex-shrink:0;}
.exercise-card .chevron svg{width:16px;height:16px;}

.searchbar{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-pill);padding:9px 14px;margin-bottom:12px;}
.searchbar svg{width:16px;height:16px;color:var(--text-faint);flex-shrink:0;}
.searchbar input{border:none;background:none;outline:none;color:var(--text);font-size:14px;width:100%;font-weight:600;}

/* ---------- Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:var(--radius-sm);padding:13px 16px;font-weight:800;font-size:14.5px;cursor:pointer;}
.btn svg{width:16px;height:16px;}
.btn-primary{background:rgb(var(--accent-rgb));color:#fff;}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn-danger{background:none;color:#E4543B;border:1px solid rgba(228,84,59,.35);}
.btn-block{width:100%;}
.btn-add{background:none;border:1.5px dashed var(--border);color:var(--text-dim);width:100%;padding:12px;border-radius:var(--radius-sm);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;}
.btn-add svg{width:15px;height:15px;}
.row-2{display:flex;gap:10px;}
.row-2>*{flex:1;}

/* ---------- Modal ---------- */
.overlay-layer{position:fixed;inset:0;z-index:100;pointer-events:none;}
.overlay-layer.open{pointer-events:auto;}
#overlay2{z-index:200;}
.modal-backdrop{position:absolute;inset:0;background:var(--overlay-bg);opacity:0;transition:opacity .22s ease;}
.overlay-layer.open .modal-backdrop{opacity:1;}
.modal-sheet{position:absolute;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;max-height:90vh;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);border-top:1px solid var(--border);}
.overlay-layer.open .modal-sheet{transform:translateY(0);}
.modal-sheet.centered{position:absolute;left:14px;right:14px;top:50%;bottom:auto;max-height:82vh;border-radius:22px;transform:translate(0,-46%) scale(.94);opacity:0;border:1px solid var(--border);}
.overlay-layer.open .modal-sheet.centered{transform:translate(0,-50%) scale(1);opacity:1;}
.modal-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 2px;flex-shrink:0;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 12px;flex-shrink:0;border-bottom:1px solid var(--border);}
.modal-header h2{font-family:'Big Shoulders Display',sans-serif;font-size:19px;font-weight:700;margin:0;}
.modal-body{padding:16px 18px;overflow-y:auto;flex:1;}
.modal-footer{padding:14px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);flex-shrink:0;display:flex;gap:10px;}

/* ---------- Photo gallery ---------- */
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.gallery .g-item{aspect-ratio:1/1;border-radius:10px;overflow:hidden;position:relative;background:var(--surface-2);}
.gallery .g-item img{width:100%;height:100%;object-fit:cover;}
.gallery .g-item button{position:absolute;top:3px;right:3px;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.gallery .g-item button svg{width:11px;height:11px;}
.gallery .g-add{aspect-ratio:1/1;border-radius:10px;border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--text-faint);cursor:pointer;position:relative;}
.gallery .g-add svg{width:18px;height:18px;}
.gallery .g-add input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.lightbox-img{width:100%;border-radius:14px;display:block;}

/* ---------- Settings ---------- */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);gap:14px;}
.setting-row:last-child{border-bottom:none;}
.setting-row .t{font-weight:800;font-size:14px;}
.setting-row .s{font-size:12px;color:var(--text-faint);margin-top:2px;}
.switch{width:46px;height:27px;border-radius:var(--radius-pill);background:var(--surface-2);border:1px solid var(--border);position:relative;cursor:pointer;flex-shrink:0;}
.switch .knob{position:absolute;top:2px;left:2px;width:21px;height:21px;border-radius:50%;background:var(--text-faint);transition:all .18s ease;}
.switch.on{background:rgba(var(--accent-rgb),.25);border-color:rgba(var(--accent-rgb),.5);}
.switch.on .knob{left:calc(100% - 23px);background:rgb(var(--accent-rgb));}
.swatchrow{display:flex;gap:10px;}
.swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:2px solid transparent;position:relative;flex-shrink:0;}
.swatch.active{border-color:var(--text);}
.swatch.active::after{content:'';position:absolute;inset:-5px;border-radius:50%;border:1.4px solid var(--text);}

/* ---------- Sparkline ---------- */
.spark-wrap{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;margin-top:10px;}
.spark-wrap .sv{font-family:'Big Shoulders Display',sans-serif;font-size:20px;font-weight:700;}
.spark-wrap .sl{font-size:11px;color:var(--text-faint);font-weight:700;}

/* watch */
.watch-devicerow{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;background:var(--surface-2);}
.watch-devicerow:active{background:var(--raised);}
.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--border);border-top-color:rgb(var(--accent-rgb));animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.pulse-dot{width:9px;height:9px;border-radius:50%;background:#3EC26A;box-shadow:0 0 0 0 rgba(62,194,106,.5);animation:pulse 1.8s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,194,106,.45);}70%{box-shadow:0 0 0 7px rgba(62,194,106,0);}100%{box-shadow:0 0 0 0 rgba(62,194,106,0);}}

.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:var(--raised);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:var(--radius-pill);font-size:13px;font-weight:700;box-shadow:var(--shadow);z-index:300;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.hidden{display:none!important;}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay-layer"></div>
<div id="overlay2" class="overlay-layer"></div>
<div id="toast" class="toast"></div>

<script>
/* =================== ICONS =================== */
const ICONS = {

/* =================== DATE HELPERS =================== */
function pad(n){return n<10?'0'+n:''+n;}
function toISO(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fromISO(s){const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12,0,0);}
function todayISO(){return toISO(new Date());}
function addDays(iso,n){const d=fromISO(iso);d.setDate(d.getDate()+n);return toISO(d);}
function addMonths(iso,n){const d=fromISO(iso);d.setMonth(d.getMonth()+n);return toISO(d);}
function startOfWeekMon(iso){const d=fromISO(iso);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return toISO(d);}
function dayStatus(iso){const t=todayISO();return iso<t?'past':(iso===t?'today':'future');}
function calcAge(birthISO){
  if(!birthISO) return null;
  const b=fromISO(birthISO),t=new Date();
  let age=t.getFullYear()-b.getFullYear();
  const m=t.getMonth()-b.getMonth();
  if(m<0||(m===0&&t.getDate()<b.getDate()))age--;
  return age;
}
function fmtDateHuman(iso){
  const d=fromISO(iso);
  return d.getDate()+' '+MONTHS[d.getMonth()].toLowerCase().replace(/й$|нь$|ль$|ль$/,m=>m)+' '+d.getFullYear();
}
function fmtDateShort(iso){
  const d=fromISO(iso);
  return d.getDate()+' '+MONTHS[d.getMonth()].slice(0,3).toLowerCase();
}

/* =================== UTIL =================== */
function findExercise(id){return state.exercises.find(e=>e.id===id);}
function findComplex(id){return state.complexes.find(c=>c.id===id);}
function workoutsOn(iso){return state.workouts.filter(w=>w.date===iso).sort((a,b)=>a.time.localeCompare(b.time));}
function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(s=>s[0]).join('').toUpperCase();
}
function itemLabel(item){
  if(item.type==='exercise'){const e=findExercise(item.id);return e?e.name:'Упражнение удалено';}
  const c=findComplex(item.id);return c?c.name:'Комплекс удалён';
}
function itemZones(item){
  if(item.type==='exercise'){const e=findExercise(item.id);return e?[e.zone]:[];}
  const c=findComplex(item.id);if(!c)return[];
  return [...new Set(c.exerciseIds.map(id=>findExercise(id)).filter(Boolean).map(e=>e.zone))];
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('show'),1800);
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* =================== CALENDAR SCREEN =================== */
function renderCalendarScreen(){
  const modes=[['day','День'],['week','Неделя'],['month','Месяц'],['year','Год']];
  let body='';
  if(state.ui.calMode==='month') body=renderMonthView();
  else if(state.ui.calMode==='week') body=renderWeekView();
  else if(state.ui.calMode==='day') body=renderDayView();
  else body=renderYearView();

  return `
    <div class="segmented">${modes.map(([m,l])=>`<button class="${state.ui.calMode===m?'active':''}" data-action="set-mode" data-mode="${m}">${l}</button>`).join('')}</div>
    ${body}
  `;
}

function calNavLabel(){
  const c=fromISO(state.ui.cursor);
  if(state.ui.calMode==='month') return MONTHS[c.getMonth()]+' '+c.getFullYear();
  if(state.ui.calMode==='year') return ''+c.getFullYear();
  if(state.ui.calMode==='week'){
    const s=fromISO(startOfWeekMon(state.ui.cursor));
    const e=fromISO(addDays(startOfWeekMon(state.ui.cursor),6));
    return s.getDate()+' — '+e.getDate()+' '+MONTHS[e.getMonth()].toLowerCase();
  }
  return fmtDateHuman(state.ui.cursor);
}

function renderCalNav(){
  return `<div class="calnav">
    <div class="navbtns"><button class="navbtn" data-action="cal-prev">${icon('chevronLeft')}</button></div>
    <div class="label">${calNavLabel()}</div>
    <div class="navbtns">
      <button class="todaybtn" data-action="cal-today">Сегодня</button>
      <button class="navbtn" data-action="cal-next">${icon('chevronRight')}</button>
    </div>
  </div>`;
}

function renderMonthView(){
  const c=fromISO(state.ui.cursor);
  const year=c.getFullYear(),month=c.getMonth();
  const firstOfMonth=new Date(year,month,1);
  const startOffset=(firstOfMonth.getDay()+6)%7;
  const gridStart=new Date(year,month,1-startOffset);
  let cells='';
  for(let i=0;i<42;i++){
    const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);
    const iso=toISO(d);
    const inMonth=d.getMonth()===month;
    const wo=workoutsOn(iso);
    const st=dayStatus(iso);
    const dotsHtml=wo.slice(0,3).map(w=>`<span class="dot ${dayStatus(w.date)}"></span>`).join('');
    cells+=`<div class="day-cell ${inMonth?'':'other-month'} ${st==='today'?'today':''}" data-action="pick-day" data-date="${iso}">
      <div class="num">${d.getDate()}</div>
      <div class="dots">${dotsHtml}</div>
    </div>`;
  }
  return `${renderCalNav()}
    <div class="weekday-row">${WEEKDAYS.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="month-grid">${cells}</div>`;
}

function renderWeekView(){
  const start=startOfWeekMon(state.ui.cursor);
  let rows='';
  for(let i=0;i<7;i++){
    const iso=addDays(start,i);
    const d=fromISO(iso);
    const wo=workoutsOn(iso);
    const isToday=iso===todayISO();
    rows+=`<div class="week-row ${isToday?'is-today':''}" data-action="pick-day" data-date="${iso}">
      <div class="wd"><div class="n">${d.getDate()}</div><div class="l">${WEEKDAYS[i]}</div></div>
      <div class="chips">${wo.length? wo.map(w=>`<span class="mini-chip ${isToday?'today':''}">${w.time} · ${esc(w.name)}</span>`).join('') : '<span class="none">Тренировок нет</span>'}</div>
    </div>`;
  }
  return `${renderCalNav()}<div class="week-list">${rows}</div>`;
}

function renderDayView(){
  const iso=state.ui.cursor;
  const d=fromISO(iso);
  const wo=workoutsOn(iso);
  const st=dayStatus(iso);
  const stLabel=st==='past'?'Прошедший день':(st==='today'?'Сегодня':'Предстоящий день');
  let cards='';
  if(wo.length===0){
    cards=`<div class="empty">${icon('calendar')}<div class="t">На этот день ничего не запланировано</div><div class="s">Нажмите «+», чтобы добавить тренировку на ${fmtDateShort(iso)}.</div></div>`;
  }else{
    cards='<div class="day-cards">'+wo.map(w=>renderWorkoutCard(w)).join('')+'</div>';
  }
  return `${renderCalNav()}
    <div class="day-head">
      <div class="big">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3).toLowerCase()}</div>
      <div class="sub">${WEEKDAYS[(d.getDay()+6)%7]==='Сб'||WEEKDAYS[(d.getDay()+6)%7]==='Вс'?'Выходной · ':''}${stLabel}</div>
    </div>
    ${cards}`;
}

function renderWorkoutCard(w){
  const st=dayStatus(w.date);
  const stLabel=st==='past'?'Прошла':(st==='today'?'Сегодня':'Скоро');
  const zones=[...new Set(w.items.flatMap(itemZones))];
  return `<div class="wk-card" data-action="open-workout" data-id="${w.id}">
    <div class="wk-card-top">
      <div>
        <div class="time">${w.time}</div>
        <div class="name">${esc(w.name)}</div>
        <div class="meta">${w.duration} мин · ${w.items.length} ${w.items.length===1?'элемент':'элемента(ов)'}</div>
      </div>
      <span class="status-badge ${st}">${stLabel}</span>
    </div>
    <div class="tags">${zones.map(z=>`<span class="tag">${esc(z)}</span>`).join('')}</div>
  </div>`;
}

function renderYearView(){
  const year=fromISO(state.ui.cursor).getFullYear();
  let months='';
  for(let m=0;m<12;m++){
    const first=new Date(year,m,1);
    const startOffset=(first.getDay()+6)%7;
    const daysInMonth=new Date(year,m+1,0).getDate();
    let cells='';
    for(let i=0;i<startOffset;i++) cells+='<div class="mm-cell blank"></div>';
    for(let dd=1;dd<=daysInMonth;dd++){
      const iso=year+'-'+pad(m+1)+'-'+pad(dd);
      const cnt=workoutsOn(iso).length;
      const cls=cnt===0?'':(cnt===1?'has1':(cnt===2?'has2':'has3'));
      cells+=`<div class="mm-cell ${cls}"></div>`;
    }
    months+=`<div class="mini-month" data-action="pick-month" data-month="${m}">
      <div class="mm-title">${MONTHS[m]}</div>
      <div class="mm-grid">${cells}</div>
    </div>`;
  }
  return `${renderCalNav()}<div class="year-grid">${months}</div>`;
}

/* =================== EVENT DELEGATION =================== */
document.addEventListener('click', function(e){
  const t=e.target.closest('[data-action]');
  if(!t) return;
  const action=t.dataset.action;
  handleAction(action,t,e);
});

function handleAction(action,t){
  switch(action){
    case 'nav': state.ui.screen=t.dataset.screen; render(); break;
    case 'set-mode': state.ui.calMode=t.dataset.mode; render(); break;
    case 'cal-prev': navCal(-1); break;
    case 'cal-next': navCal(1); break;
    case 'cal-today': state.ui.cursor=todayISO(); render(); break;
    case 'pick-day':
      state.ui.selectedDate=t.dataset.date; state.ui.cursor=t.dataset.date; state.ui.calMode='day'; render(); break;
    case 'pick-month':
      { const y=fromISO(state.ui.cursor).getFullYear(); state.ui.cursor=y+'-'+pad(Number(t.dataset.month)+1)+'-01'; state.ui.calMode='month'; render(); }
      break;
    case 'open-profile': state.ui.screen='profile'; render(); break;
    case 'open-settings': openSettingsModal(); break;
    case 'add-workout': openWorkoutEditor(null, state.ui.selectedDate); break;
    case 'open-workout': openWorkoutEditor(state.workouts.find(w=>w.id===t.dataset.id)); break;
    case 'lib-tab': state.ui.libTab=t.dataset.tab; render(); break;
    case 'lib-filter-zone': state.ui.libZoneFilter = state.ui.libZoneFilter===t.dataset.zone?null:t.dataset.zone; render(); break;
    case 'lib-filter-equip': state.ui.libEquipFilter = state.ui.libEquipFilter===t.dataset.equip?null:t.dataset.equip; render(); break;
    case 'new-exercise': openExerciseEditor(null); break;
    case 'open-exercise': openExerciseEditor(findExercise(t.dataset.id)); break;
    case 'new-complex': openComplexEditor(null); break;
    case 'open-complex': openComplexEditor(findComplex(t.dataset.id)); break;
    case 'save-profile': saveProfileBasics(); break;
    case 'open-weight-log': openWeightLog(); break;
    case 'open-measurements': openMeasurements(); break;
    default: break;
  }
}

function navCal(dir){
  const m=state.ui.calMode;
  if(m==='month') state.ui.cursor=addMonths(state.ui.cursor,dir);
  else if(m==='week') state.ui.cursor=addDays(state.ui.cursor,7*dir);
  else if(m==='day') state.ui.cursor=addDays(state.ui.cursor,dir);
  else if(m==='year') state.ui.cursor=addMonths(state.ui.cursor,12*dir);
  render();
}

function saveProfileBasics(){
  state.profile.name=document.getElementById('pf-name').value.trim()||'Без имени';
  state.profile.birthDate=document.getElementById('pf-birth').value||'';
  state.profile.gender=document.getElementById('pf-gender').value;
  state.profile.height=Number(document.getElementById('pf-height').value)||0;
  render();
  showToast('Профиль сохранён');
}

/* =================== MODAL ENGINE =================== */
function openModal(html, layer){
  const el=document.getElementById(layer||'overlay');
  el.innerHTML=`<div class="modal-backdrop" data-close="${layer||'overlay'}"></div>${html}`;
  requestAnimationFrame(()=>el.classList.add('open'));
  el.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(layer)));
}
function closeModal(layer){
  const el=document.getElementById(layer||'overlay');
  el.classList.remove('open');
  setTimeout(()=>{el.innerHTML='';},260);
}

/* =================== SETTINGS MODAL =================== */
function openSettingsModal(){
  renderSettingsModal();
}
function renderSettingsModal(){
  const s=state.settings;
  const w=s.watch;
  const accents=[['ember','#FF5A36'],['moss','#7AB242'],['cyan','#20B6B2'],['violet','#8C6CD8']];
  openModal(`
    <div class="modal-sheet" style="max-height:88vh;">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>Настройки</h2><button class="icon-btn" data-close="overlay">${icon('close')}</button></div>
      <div class="modal-body">
        <div class="setting-row">
          <div><div class="t">Тёмный режим</div><div class="s">Переключение день / ночь</div></div>
          <div class="switch ${s.theme==='dark'?'on':''}" data-action-inline="toggle-theme"></div>
        </div>
        <div class="setting-row" style="display:block;">
          <div class="t" style="margin-bottom:10px;">Цветовая схема</div>
          <div class="swatchrow">${accents.map(([key,hex])=>`<div class="swatch ${s.accent===key?'active':''}" style="background:${hex}" data-action-inline="set-accent" data-accent="${key}"></div>`).join('')}</div>
        </div>
        <div class="setting-row" style="display:block;">
          <div class="t" style="margin-bottom:2px;">Данные приложения</div>
          <div class="s" style="margin-bottom:12px;">Данные хранятся в текущей сессии. Скачайте резервную копию, чтобы сохранить прогресс, и загрузите её в другой раз.</div>
          <div class="row-2">
            <button class="btn btn-ghost" data-action-inline="export-data">${icon('download')} Скачать</button>
            <button class="btn btn-ghost" data-action-inline="import-data">${icon('upload')} Загрузить</button>
          </div>
          <input type="file" id="import-file" accept="application/json" class="hidden">
        </div>
        <div class="setting-row" style="display:block;border-bottom:none;">
          <div class="t" style="margin-bottom:2px;">Смарт-часы</div>
          <div class="s" style="margin-bottom:12px;">${w.connected?`Подключено: ${esc(w.device)}`:'Синхронизируйте тренировки с носимым устройством'}</div>
          <div id="watch-panel">${renderWatchPanel()}</div>
        </div>
      </div>
    </div>
  `);
  document.getElementById('overlay').addEventListener('click', settingsInlineHandler);
  const fileInput=document.getElementById('import-file');
  if(fileInput) fileInput.addEventListener('change', handleImportFile);
}
function renderWatchPanel(){
  const w=state.settings.watch;
  if(w.connected){
    return `<div class="watch-devicerow"><div style="display:flex;align-items:center;gap:10px;">${icon('watch')}<div><div style="font-weight:800;font-size:13.5px;">${esc(w.device)}</div><div style="font-size:11px;color:var(--text-faint);">Последняя синхронизация: только что</div></div></div><span class="pulse-dot"></span></div>
    <button class="btn btn-danger btn-block" data-action-inline="watch-disconnect">Отключить</button>`;
  }
  if(w.scanning){
    return `<div class="watch-devicerow"><div style="display:flex;align-items:center;gap:10px;"><div class="spinner"></div><span style="font-size:13px;color:var(--text-dim);font-weight:700;">Поиск устройств рядом…</span></div></div>`;
  }
  if(w._found){
    return w._found.map(d=>`<div class="watch-devicerow" data-action-inline="watch-connect" data-device="${esc(d)}"><div style="display:flex;align-items:center;gap:10px;">${icon('watch')}<span style="font-size:13.5px;font-weight:700;">${esc(d)}</span></div>${icon('chevronRightSm')}</div>`).join('')
    +`<div class="s" style="margin-top:8px;">Демонстрационное подключение — реальная синхронизация потребует Web Bluetooth API.</div>`;
  }
  return `<button class="btn btn-ghost btn-block" data-action-inline="watch-scan">${icon('watch')} Найти устройства</button>`;
}
function settingsInlineHandler(e){
  const t=e.target.closest('[data-action-inline]');
  if(!t) return;
  const a=t.dataset.actionInline;
  if(a==='toggle-theme'){ state.settings.theme = state.settings.theme==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',state.settings.theme); renderSettingsModal(); render(); }
  else if(a==='set-accent'){ state.settings.accent=t.dataset.accent; document.documentElement.setAttribute('data-accent',state.settings.accent); renderSettingsModal(); render(); }
  else if(a==='export-data'){ exportData(); }
  else if(a==='import-data'){ document.getElementById('import-file').click(); }
  else if(a==='watch-scan'){
    state.settings.watch.scanning=true; document.getElementById('watch-panel').innerHTML=renderWatchPanel();
    setTimeout(()=>{ state.settings.watch.scanning=false; state.settings.watch._found=['FizUp Band X2','Amazfit GTS 4','Xiaomi Mi Band 8']; const p=document.getElementById('watch-panel'); if(p) p.innerHTML=renderWatchPanel(); },1300);
  }
  else if(a==='watch-connect'){
    state.settings.watch.connected=true; state.settings.watch.device=t.dataset.device; state.settings.watch._found=null;
    const p=document.getElementById('watch-panel'); if(p) p.innerHTML=renderWatchPanel();
    showToast('Часы подключены');
  }
  else if(a==='watch-disconnect'){
    state.settings.watch.connected=false; state.settings.watch.device=null;
    const p=document.getElementById('watch-panel'); if(p) p.innerHTML=renderWatchPanel();
  }
}
function exportData(){
  const data={profile:state.profile,settings:state.settings,exercises:state.exercises,complexes:state.complexes,workouts:state.workouts};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='fizup-backup.json';document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Резервная копия скачана');
}
function handleImportFile(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    try{
      const data=JSON.parse(ev.target.result);
      if(data.profile) state.profile=data.profile;
      if(data.settings) state.settings=data.settings;
      if(data.exercises) state.exercises=data.exercises;
      if(data.complexes) state.complexes=data.complexes;
      if(data.workouts) state.workouts=data.workouts;
      closeModal('overlay'); render(); showToast('Данные загружены');
    }catch(err){ showToast('Не удалось прочитать файл'); }
  };
  reader.readAsText(file);
}

/* =================== WORKOUT EDITOR =================== */
function openWorkoutEditor(existing, presetDate){

  renderWorkoutEditor(!!existing);
}
function renderWorkoutEditor(isEdit){
  const d=workoutDraft;
  const st=dayStatus(d.date);
  const stLabel=st==='past'?'Прошедшая':(st==='today'?'Сегодня':'Предстоящая');
  openModal(`
    <div class="modal-sheet" style="max-height:92vh;">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>${isEdit?'Тренировка':'Новая тренировка'}</h2><button class="icon-btn" data-close="overlay">${icon('close')}</button></div>
      <div class="modal-body">
        <div class="field"><label>Название</label><input type="text" id="w-name" placeholder="Например, «Спина и бицепс»" value="${esc(d.name)}"></div>
        <div class="field-row">
          <div class="field"><label>Дата</label><input type="date" id="w-date" value="${d.date}"></div>
          <div class="field"><label>Время</label><input type="time" id="w-time" value="${d.time}"></div>
        </div>
        <div class="field">
          <label>Продолжительность, мин</label>
          <input type="number" id="w-duration" value="${d.duration}">
          <div class="durchips" style="margin-top:8px;">${[30,45,60,90].map(m=>`<button class="chip ${d.duration==m?'active':''}" data-action-inline="dur" data-dur="${m}">${m}</button>`).join('')}</div>
        </div>
        <div class="field">
          <label>Статус</label>
          <span class="status-badge ${st}">${stLabel}</span>
        </div>
        <div class="field">
          <label>Упражнения и комплексы</label>
          <div id="w-items">${renderWorkoutItems()}</div>
          <div class="row-2" style="margin-top:8px;">
            <button class="btn-add" data-action-inline="add-exercise-item">${icon('plus')} Упражнение</button>
            <button class="btn-add" data-action-inline="add-complex-item">${icon('plus')} Комплекс</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        ${isEdit?`<button class="btn btn-danger" data-action-inline="delete-workout">${icon('trash')}</button>`:''}
        <button class="btn btn-primary btn-block" data-action-inline="save-workout">Сохранить</button>
      </div>
    </div>
  `);
  document.getElementById('overlay').addEventListener('click', workoutInlineHandler);
}
function renderWorkoutItems(){
  if(workoutDraft.items.length===0) return `<div class="s" style="color:var(--text-faint);font-size:12.5px;padding:6px 0;">Пока ничего не добавлено</div>`;
  return workoutDraft.items.map((it,idx)=>`
    <div class="list-item">
      <div class="thumb">${icon(it.type==='exercise'?'dumbbell':'dumbbell')}</div>
      <div class="body"><div class="n">${esc(itemLabel(it))}</div><div class="m">${it.type==='exercise'?'Упражнение':'Комплекс'} · ${itemZones(it).join(', ')||'—'}</div></div>
      <button class="del" data-action-inline="remove-item" data-idx="${idx}">${icon('trash')}</button>
    </div>`).join('');
}
function workoutInlineHandler(e){
  const t=e.target.closest('[data-action-inline]');
  if(!t) return;
  const a=t.dataset.actionInline;
  if(a==='dur'){ workoutDraft.duration=Number(t.dataset.dur); renderWorkoutEditor(!!workoutDraft.id); }
  else if(a==='remove-item'){ workoutDraft.items.splice(Number(t.dataset.idx),1); document.getElementById('w-items').innerHTML=renderWorkoutItems(); }
  else if(a==='add-exercise-item'){ openPicker('exercise'); }
  else if(a==='add-complex-item'){ openPicker('complex'); }
  else if(a==='save-workout'){ saveWorkoutDraft(); }
  else if(a==='delete-workout'){ state.workouts=state.workouts.filter(w=>w.id!==workoutDraft.id); closeModal('overlay'); render(); showToast('Тренировка удалена'); }
}
function saveWorkoutDraft(){
  const name=document.getElementById('w-name').value.trim();
  if(!name){ showToast('Укажите название тренировки'); return; }
  workoutDraft.name=name;
  workoutDraft.date=document.getElementById('w-date').value||todayISO();
  workoutDraft.time=document.getElementById('w-time').value||'00:00';
  workoutDraft.duration=Number(document.getElementById('w-duration').value)||30;
  if(workoutDraft.id){
    const idx=state.workouts.findIndex(w=>w.id===workoutDraft.id);
    state.workouts[idx]=workoutDraft;
  }else{
    workoutDraft.id=nextId();
    state.workouts.push(workoutDraft);
  }
  state.ui.selectedDate=workoutDraft.date; state.ui.cursor=workoutDraft.date;
  closeModal('overlay'); render(); showToast('Тренировка сохранена');
}

/* =================== PICKER (nested modal) =================== */
function openPicker(kind){
  renderPicker(kind,'');
}
function renderPicker(kind,query){
  const items = kind==='exercise'
    ? state.exercises.filter(e=>e.name.toLowerCase().includes(query.toLowerCase()))
    : state.complexes.filter(c=>c.name.toLowerCase().includes(query.toLowerCase()));
  openModal(`
    <div class="modal-sheet centered" style="max-height:80vh;">
      <div class="modal-header"><h2>${kind==='exercise'?'Выбрать упражнение':'Выбрать комплекс'}</h2><button class="icon-btn" data-close="overlay2">${icon('close')}</button></div>
      <div class="modal-body">
        <div class="searchbar">${icon('search')}<input type="text" id="picker-search" placeholder="Поиск…" value="${esc(query)}"></div>
        <div id="picker-list">${items.length?items.map(i=>`<div class="list-item" style="cursor:pointer;" data-action-inline="pick" data-id="${i.id}"><div class="thumb">${icon('dumbbell')}</div><div class="body"><div class="n">${esc(i.name)}</div>${kind==='exercise'?`<div class="m">${esc(i.zone)} · ${esc(i.equipment)}</div>`:`<div class="m">${i.exerciseIds.length} упражнений</div>`}</div></div>`).join(''):'<div class="s" style="color:var(--text-faint);padding:10px 0;">Ничего не найдено</div>'}</div>
        <button class="btn-add" style="margin-top:10px;" data-action-inline="create-new">${icon('plus')} Создать новое</button>
      </div>
    </div>
  `,'overlay2');
  const ov2=document.getElementById('overlay2');
  ov2.addEventListener('click', function handler(e){
    const t=e.target.closest('[data-action-inline]');
    if(!t) return;
    const a=t.dataset.actionInline;
    if(a==='pick'){
      workoutOrComplexAddItem(kind,t.dataset.id);
      closeModal('overlay2');
    } else if(a==='create-new'){
      closeModal('overlay2');
      if(kind==='exercise') openExerciseEditor(null, true);
      else openComplexEditor(null, true);
    }
  });
  const search=document.getElementById('picker-search');
  search.addEventListener('input',()=>renderPicker(kind, search.value));
  search.focus();
}
function workoutOrComplexAddItem(kind, id){
  if(complexDraft && complexDraft._active){
    complexDraft.exerciseIds.push(id);
    document.getElementById('c-items').innerHTML=renderComplexItems();
    return;
  }
  workoutDraft.items.push({type:kind,id});
  const el=document.getElementById('w-items');
  if(el) el.innerHTML=renderWorkoutItems();
}

          <label>Упражнения</label>
          <div id="c-items">${renderComplexItems()}</div>
          <button class="btn-add" style="margin-top:8px;" data-action-inline="c-add-ex">${icon('plus')} Упражнение</button>
        </div>
      </div>
      <div class="modal-footer">
        ${isEdit?`<button class="btn btn-danger" data-action-inline="c-delete">${icon('trash')}</button>`:''}
        <button class="btn btn-primary btn-block" data-action-inline="c-save">Сохранить</button>
      </div>
    </div>
  `);
  document.getElementById('overlay').addEventListener('click', complexInlineHandler);
}
function renderComplexItems(){
  if(complexDraft.exerciseIds.length===0) return `<div class="s" style="color:var(--text-faint);font-size:12.5px;padding:6px 0;">Пока ничего не добавлено</div>`;
  return complexDraft.exerciseIds.map((id,idx)=>{
    const ex=findExercise(id);
    return `<div class="list-item">
      <div class="thumb">${icon('dumbbell')}</div>
      <div class="body"><div class="n">${esc(ex?ex.name:'Удалено')}</div><div class="m">${ex?ex.zone+' · '+ex.equipment:''}</div></div>
      <button class="del" data-action-inline="c-remove" data-idx="${idx}">${icon('trash')}</button>
    </div>`;
  }).join('');
}
function complexInlineHandler(e){
  const t=e.target.closest('[data-action-inline]');
  if(!t) return;
  const a=t.dataset.actionInline;
  if(a==='c-add-ex') openPicker('exercise');
  else if(a==='c-remove'){ complexDraft.exerciseIds.splice(Number(t.dataset.idx),1); document.getElementById('c-items').innerHTML=renderComplexItems(); }
  else if(a==='c-save'){
    const name=document.getElementById('c-name').value.trim();
    if(!name){ showToast('Укажите название комплекса'); return; }
    complexDraft.name=name;
    delete complexDraft._active; const returnToPicker=complexDraft._returnToPicker; delete complexDraft._returnToPicker;
    if(complexDraft.id){ const idx=state.complexes.findIndex(c=>c.id===complexDraft.id); state.complexes[idx]=complexDraft; }
    else{ complexDraft.id=nextId(); state.complexes.push(complexDraft); }
    closeModal('overlay'); render(); showToast('Комплекс сохранён');
    if(returnToPicker && workoutDraft){ workoutDraft.items.push({type:'complex',id:complexDraft.id}); }
  }
  else if(a==='c-delete'){ state.complexes=state.complexes.filter(c=>c.id!==complexDraft.id); closeModal('overlay'); render(); showToast('Комплекс удалён'); }
}

/* =================== EXERCISE EDITOR =================== */
function openExerciseEditor(existing, returnToPicker){
  exerciseDraft = existing ? JSON.parse(JSON.stringify(existing)) : {id:null,name:'',zone:ZONES[0],equipment:EQUIPMENT[0],description:'',photos:[]};
  exerciseDraft._returnToPicker=!!returnToPicker;
  renderExerciseEditor(!!existing);
}
function renderExerciseEditor(isEdit){
  const d=exerciseDraft;
  openModal(`
    <div class="modal-sheet" style="max-height:94vh;">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>${isEdit?'Упражнение':'Новое упражнение'}</h2><button class="icon-btn" data-close="overlay">${icon('close')}</button></div>
      <div class="modal-body">
        <div class="field"><label>Название</label><input type="text" id="e-name" placeholder="Например, «Отжимания на брусьях»" value="${esc(d.name)}"></div>
        <div class="field">
          <label>Зона</label>
          <div class="chiprow" id="e-zone-row">${ZONES.map(z=>`<button class="chip ${d.zone===z?'active':''}" data-action-inline="e-zone" data-val="${z}">${z}</button>`).join('')}</div>
        </div>
        <div class="field">
          <label>Снаряд</label>
          <div class="chiprow" id="e-equip-row">${EQUIPMENT.map(eq=>`<button class="chip ${d.equipment===eq?'active':''}" data-action-inline="e-equip" data-val="${eq}">${eq}</button>`).join('')}</div>
        </div>
        <div class="field"><label>Описание</label><textarea id="e-desc" placeholder="Техника выполнения, акценты, ошибки…">${esc(d.description)}</textarea></div>
        <div class="field">
          <label>Галерея фото</label>
          <div class="gallery" id="e-gallery">${renderGallery()}</div>
        </div>
      </div>
      <div class="modal-footer">
        ${isEdit?`<button class="btn btn-danger" data-action-inline="e-delete">${icon('trash')}</button>`:''}
        <button class="btn btn-primary btn-block" data-action-inline="e-save">Сохранить</button>
      </div>
    </div>
  `);
  document.getElementById('overlay').addEventListener('click', exerciseInlineHandler);
  document.getElementById('overlay').addEventListener('change', exerciseFileHandler);
}
function renderGallery(){
  const photos=exerciseDraft.photos||[];
  let html=photos.map((src,idx)=>`<div class="g-item"><img src="${src}"><button data-action-inline="e-photo-del" data-idx="${idx}">${icon('close')}</button></div>`).join('');
  html+=`<label class="g-add">${icon('camera')}<input type="file" accept="image/*" id="e-photo-input" multiple></label>`;
  return html;
}
function exerciseInlineHandler(e){
  const t=e.target.closest('[data-action-inline]');
  if(!t) return;
  const a=t.dataset.actionInline;
  if(a==='e-zone'){ exerciseDraft.zone=t.dataset.val; document.getElementById('e-zone-row').querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.val===exerciseDraft.zone)); }
  else if(a==='e-equip'){ exerciseDraft.equipment=t.dataset.val; document.getElementById('e-equip-row').querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.val===exerciseDraft.equipment)); }
  else if(a==='e-photo-del'){ exerciseDraft.photos.splice(Number(t.dataset.idx),1); document.getElementById('e-gallery').innerHTML=renderGallery(); }
  else if(a==='e-save'){
    const name=document.getElementById('e-name').value.trim();
    if(!name){ showToast('Укажите название упражнения'); return; }
    exerciseDraft.name=name;
    exerciseDraft.description=document.getElementById('e-desc').value.trim();
    const returnToPicker=exerciseDraft._returnToPicker; delete exerciseDraft._returnToPicker;
    if(exerciseDraft.id){ const idx=state.exercises.findIndex(x=>x.id===exerciseDraft.id); state.exercises[idx]=exerciseDraft; }
    else{ exerciseDraft.id=nextId(); state.exercises.push(exerciseDraft); }
    const savedId=exerciseDraft.id;
    closeModal('overlay'); render(); showToast('Упражнение сохранено');
    if(returnToPicker){
      if(complexDraft && complexDraft._active){ complexDraft.exerciseIds.push(savedId); const ci=document.getElementById('c-items'); if(ci) ci.innerHTML=renderComplexItems(); }
      else if(workoutDraft){ workoutDraft.items.push({type:'exercise',id:savedId}); const wi=document.getElementById('w-items'); if(wi) wi.innerHTML=renderWorkoutItems(); }
    }
  }
  else if(a==='e-delete'){ state.exercises=state.exercises.filter(x=>x.id!==exerciseDraft.id); closeModal('overlay'); render(); showToast('Упражнение удалено'); }
}
function exerciseFileHandler(e){
  if(e.target.id!=='e-photo-input') return;
  const files=Array.from(e.target.files||[]);
  let remaining=files.length;
  if(!remaining) return;
  files.forEach(file=>{
    const reader=new FileReader();
    reader.onload=ev=>{
      exerciseDraft.photos.push(ev.target.result);
      remaining--;
      if(remaining===0){ const g=document.getElementById('e-gallery'); if(g) g.innerHTML=renderGallery(); }
    };
    reader.readAsDataURL(file);
  });
}

/* =================== WEIGHT LOG =================== */
function openWeightLog(){ renderWeightLog(); }
function renderWeightLog(){
  const log=[...state.profile.weightLog].sort((a,b)=>a.date.localeCompare(b.date));
  const last=log.length?log[log.length-1].weight:0;
  const first=log.length?log[0].weight:0;
  const diff=(last-first).toFixed(1);
  openModal(`
    <div class="modal-sheet" style="max-height:90vh;">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>Журнал веса</h2><button class="icon-btn" data-close="overlay">${icon('close')}</button></div>
      <div class="modal-body">
        <div class="spark-wrap">
          <div class="sv">${last||'—'} кг</div>
          <div class="sl">${log.length>1?`Изменение за период: ${diff>0?'+':''}${diff} кг`:'Недостаточно данных для динамики'}</div>
          ${sparklineSVG(log.map(l=>l.weight))}
        </div>
        <div class="field-row" style="margin-top:16px;">
          <div class="field"><label>Дата</label><input type="date" id="wt-date" value="${todayISO()}"></div>
          <div class="field"><label>Вес, кг</label><input type="number" step="0.1" id="wt-val" placeholder="80.0"></div>
        </div>
        <button class="btn-add" data-action-inline="wt-add">${icon('plus')} Добавить запись</button>
        <div style="margin-top:14px;">${log.slice().reverse().map(l=>`
          <div class="list-item"><div class="thumb">${icon('scale')}</div><div class="body"><div class="n">${l.weight} кг</div><div class="m">${fmtDateHuman(l.date)}</div></div><button class="del" data-action-inline="wt-del" data-id="${l.id}">${icon('trash')}</button></div>
        `).join('')||'<div class="s" style="color:var(--text-faint);padding:8px 0;">Записей пока нет</div>'}</div>
      </div>
    </div>
  `);
  document.getElementById('overlay').addEventListener('click', function handler(e){
    const t=e.target.closest('[data-action-inline]'); if(!t) return;
    const a=t.dataset.actionInline;
    if(a==='wt-add'){
      const date=document.getElementById('wt-date').value||todayISO();
      const val=Number(document.getElementById('wt-val').value);
      if(!val){ showToast('Введите вес'); return; }
      state.profile.weightLog.push({id:nextId(),date,weight:val});
      renderWeightLog(); render();
    } else if(a==='wt-del'){
      state.profile.weightLog=state.profile.weightLog.filter(l=>l.id!==t.dataset.id);
      renderWeightLog(); render();
    }
  });
}
function sparklineSVG(values){
  if(values.length<2) return '';
  const w=280,h=54,pad=4;
  const min=Math.min(...values),max=Math.max(...values);
  const range=(max-min)||1;
  const pts=values.map((v,i)=>{
    const x=pad+(i/(values.length-1))*(w-pad*2);
    const y=h-pad-((v-min)/range)*(h-pad*2);
    return x+','+y;
  }).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:54px;margin-top:8px;overflow:visible;"><polyline points="${pts}" fill="none" stroke="rgb(var(--accent-rgb))" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* =================== MEASUREMENTS =================== */
function openMeasurements(){ renderMeasurements(); }
function renderMeasurements(){
  const log=[...state.profile.measurements].sort((a,b)=>a.date.localeCompare(b.date));
  const last=log.length?log[log.length-1]:null;
  openModal(`
    <div class="modal-sheet" style="max-height:92vh;">
      <div class="modal-handle"></div>
      <div class="modal-header"><h2>Антропометрия</h2><button class="icon-btn" data-close="overlay">${icon('close')}</button></div>
      <div class="modal-body">
        <div class="stat-row" style="margin-bottom:4px;">
          <div class="stat-box"><div class="v">${last?last.chest:'—'}</div><div class="l">Грудь, см</div></div>
          <div class="stat-box"><div class="v">${last?last.biceps:'—'}</div><div class="l">Бицепс, см</div></div>
          <div class="stat-box"><div class="v">${last?last.thigh:'—'}</div><div class="l">Бедро, см</div></div>
        </div>
        <div class="field" style="margin-top:14px;"><label>Дата замера</label><input type="date" id="m-date" value="${todayISO()}"></div>
        <div class="field-row">
          <div class="field"><label>Грудь, см</label><input type="number" step="0.1" id="m-chest"></div>
          <div class="field"><label>Бицепс, см</label><input type="number" step="0.1" id="m-biceps"></div>
          <div class="field"><label>Бедро, см</label><input type="number" step="0.1" id="m-thigh"></div>
        </div>
        <button class="btn-add" data-action-inline="m-add">${icon('plus')} Добавить замер</button>
        <div style="margin-top:14px;">${log.slice().reverse().map(l=>`
          <div class="list-item"><div class="thumb">${icon('ruler')}</div><div class="body"><div class="n">Гр ${l.chest} · Бц ${l.biceps} · Бд ${l.thigh}</div><div class="m">${fmtDateHuman(l.date)}</div></div><button class="del" data-action-inline="m-del" data-id="${l.id}">${icon('trash')}</button></div>
        `).join('')||'<div class="s" style="color:var(--text-faint);padding:8px 0;">Замеров пока нет</div>'}</div>
      </div>
    </div>
  `);
  document.getElementById('overlay').addEventListener('click', function handler(e){
    const t=e.target.closest('[data-action-inline]'); if(!t) return;
    const a=t.dataset.actionInline;
    if(a==='m-add'){
      const date=document.getElementById('m-date').value||todayISO();
      const chest=Number(document.getElementById('m-chest').value)||0;
      const biceps=Number(document.getElementById('m-biceps').value)||0;
      const thigh=Number(document.getElementById('m-thigh').value)||0;
      if(!chest&&!biceps&&!thigh){ showToast('Заполните хотя бы одно поле'); return; }
      state.profile.measurements.push({id:nextId(),date,chest,biceps,thigh});
      renderMeasurements(); render();
    } else if(a==='m-del'){
      state.profile.measurements=state.profile.measurements.filter(l=>l.id!==t.dataset.id);
      renderMeasurements(); render();
    }
  });
}

/* =================== INIT =================== */
render();
</script>
</body>
</html>
